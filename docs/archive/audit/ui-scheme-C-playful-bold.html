<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYC³ AI小语 — 意外色彩·活力手作</title>
<style>
:root {
  --primary: #7C3AED; --accent: #FBBF24; --pink: #EC4899; --green: #10B981;
  --cyan: #06B6D4; --orange: #F97316; --bg: #FFF9F5; --card: #FFFFFF;
  --text-main: #1F2937; --text-sub: #6B7280; --border: #FCE7D5;
  --radius-card: 24px; --shadow: 0 6px 30px rgba(124,58,237,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans SC','PingFang SC',sans-serif; background:var(--bg); -webkit-font-smoothing:antialiased; }
.phone { width:390px; margin:20px auto; background:var(--card); border-radius:40px; overflow:hidden; box-shadow:0 8px 60px rgba(124,58,237,0.12); min-height:844px; position:relative; }

/* === Colorful Header === */
.header { padding:60px 24px 32px; background:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%); border-radius:0 0 40px 40px; color:white; position:relative; overflow:hidden; }
.header::after { content:'✦'; position:absolute; top:40px; right:30px; font-size:40px; opacity:0.2; transform:rotate(15deg); }
.header::before { content:'★'; position:absolute; bottom:20px; right:60px; font-size:24px; opacity:0.15; }
.greeting { font-size:13px; opacity:0.8; margin-bottom:6px; }
.greeting-name { font-size:28px; font-weight:800; letter-spacing:-0.01em; }
.greeting-sub { font-size:13px; opacity:0.8; margin-top:6px; }

/* === Sticker Stats === */
.sticker-stats { display:flex; gap:12px; padding:0 24px; margin-top:-20px; position:relative; z-index:2; overflow-x:auto; }
.sticker { flex-shrink:0; width:100px; background:var(--card); border-radius:var(--radius-card); padding:14px; box-shadow:var(--shadow); text-align:center; border:2px solid transparent; transition:transform 0.2s; }
.sticker:hover { transform:translateY(-4px) rotate(-2deg); }
.sticker:nth-child(1) { border-color:var(--green); }
.sticker:nth-child(2) { border-color:var(--accent); }
.sticker:nth-child(3) { border-color:var(--pink); }
.sticker:nth-child(4) { border-color:var(--cyan); }
.sticker-emoji { font-size:28px; margin-bottom:4px; }
.sticker-num { font-size:22px; font-weight:800; font-family:'DM Sans',sans-serif; }
.sticker:nth-child(1) .sticker-num { color:var(--green); }
.sticker:nth-child(2) .sticker-num { color:var(--orange); }
.sticker:nth-child(3) .sticker-num { color:var(--pink); }
.sticker:nth-child(4) .sticker-num { color:var(--cyan); }
.sticker-label { font-size:10px; color:var(--text-sub); margin-top:2px; }

/* === Playful Actions === */
.play-section { padding:28px 24px; }
.play-title { font-size:18px; font-weight:800; margin-bottom:16px; display:inline-block; position:relative; }
.play-title::after { content:''; position:absolute; bottom:0; left:0; right:0; height:6px; background:var(--accent); opacity:0.3; border-radius:3px; z-index:-1; }
.play-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.play-card { border-radius:var(--radius-card); padding:20px; cursor:pointer; transition:transform 0.2s; position:relative; overflow:hidden; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; }
.play-card:hover { transform:scale(0.97); }
.play-card.purple { background:linear-gradient(135deg,#EDE9FE,#DDD6FE); }
.play-card.yellow { background:linear-gradient(135deg,#FEF3C7,#FDE68A); }
.play-card.pink { background:linear-gradient(135deg,#FCE7F3,#FBCFE8); }
.play-card.green { background:linear-gradient(135deg,#D1FAE5,#A7F3D0); }
.play-card-emoji { font-size:32px; }
.play-card-title { font-size:15px; font-weight:700; }
.play-card-desc { font-size:11px; color:var(--text-sub); margin-top:2px; }
.play-card-badge { position:absolute; top:10px; right:10px; font-size:9px; padding:3px 8px; border-radius:10px; font-weight:700; }
.play-card.purple .play-card-badge { background:var(--primary); color:white; }
.play-card.yellow .play-card-badge { background:var(--orange); color:white; }

/* === Story Card === */
.story-section { padding:0 24px 28px; }
.story-card { background:var(--card); border-radius:var(--radius-card); overflow:hidden; box-shadow:var(--shadow); }
.story-header { padding:16px 20px; background:linear-gradient(90deg,var(--pink),var(--primary)); color:white; }
.story-header-title { font-size:14px; font-weight:700; }
.story-header-sub { font-size:11px; opacity:0.8; }
.story-body { padding:20px; }
.story-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--border); }
.story-row:last-child { border-bottom:none; }
.story-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.story-info { flex:1; }
.story-title { font-size:13px; font-weight:600; }
.story-meta { font-size:11px; color:var(--text-sub); }
.story-arrow { font-size:16px; color:var(--text-sub); }

/* === AI Bubble === */
.ai-bubble { position:absolute; bottom:100px; right:20px; display:flex; align-items:center; gap:8px; background:var(--card); padding:10px 16px 10px 10px; border-radius:30px; box-shadow:var(--shadow); cursor:pointer; z-index:10; }
.ai-bubble-emoji { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--pink)); display:flex; align-items:center; justify-content:center; font-size:18px; }
.ai-bubble-text { font-size:12px; font-weight:600; }

/* === Bottom Nav === */
.bottom-nav { position:absolute; bottom:0; left:0; right:0; background:var(--card); display:flex; justify-content:space-around; padding:12px 0 30px; border-radius:32px 32px 0 0; box-shadow:0 -4px 30px rgba(124,58,237,0.06); }
.nav-item { text-align:center; cursor:pointer; padding:4px 12px; border-radius:16px; transition:all 0.2s; }
.nav-item.active { background:linear-gradient(135deg,var(--primary),var(--pink)); }
.nav-item.active .nav-emoji { filter:hue-rotate(0deg); }
.nav-item.active .nav-label { color:white; }
.nav-emoji { font-size:22px; margin-bottom:2px; }
.nav-label { font-size:10px; color:var(--text-sub); font-weight:600; }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="greeting">👋 下午好呀！</div>
    <div class="greeting-name">小语的奇妙日常 ✨</div>
    <div class="greeting-sub">今天是冒险第 1,026 天！2岁9个月大啦 🎈</div>
  </div>

  <div class="sticker-stats">
    <div class="sticker"><div class="sticker-emoji">🌟</div><div class="sticker-num">1026</div><div class="sticker-label">成长天数</div></div>
    <div class="sticker"><div class="sticker-emoji">🏅</div><div class="sticker-num">4</div><div class="sticker-label">徽章收集</div></div>
    <div class="sticker"><div class="sticker-emoji">📚</div><div class="sticker-num">8</div><div class="sticker-label">课程完成</div></div>
    <div class="sticker"><div class="sticker-emoji">🎨</div><div class="sticker-num">12</div><div class="sticker-label">创作数量</div></div>
  </div>

  <div class="play-section">
    <div class="play-title">来玩吧！🎮</div>
    <div class="play-grid">
      <div class="play-card purple">
        <div class="play-card-emoji">🌱</div>
        <div><div class="play-card-title">成长树</div><div class="play-card-desc">记录每一天</div></div>
        <div class="play-card-badge">NEW</div>
      </div>
      <div class="play-card yellow">
        <div class="play-card-emoji">🤖</div>
        <div><div class="play-card-title">AI 小伙伴</div><div class="play-card-desc">聊天讲故事</div></div>
      </div>
      <div class="play-card pink">
        <div class="play-card-emoji">📖</div>
        <div><div class="play-card-title">绘本世界</div><div class="play-card-desc">有声故事</div></div>
      </div>
      <div class="play-card green">
        <div class="play-card-emoji">🎨</div>
        <div><div class="play-card-title">创意工坊</div><div class="play-card-desc">画画涂鸦</div></div>
        <div class="play-card-badge">HOT</div>
      </div>
    </div>
  </div>

  <div class="story-section">
    <div class="story-card">
      <div class="story-header">
        <div class="story-header-title">🌟 今日冒险任务</div>
        <div class="story-header-sub">完成获得能量宝石！</div>
      </div>
      <div class="story-body">
        <div class="story-row">
          <div class="story-icon" style="background:#FEF3C7">🔤</div>
          <div class="story-info"><div class="story-title">认识字母 A-D</div><div class="story-meta">3分钟 · +10⭐</div></div>
          <div class="story-arrow">→</div>
        </div>
        <div class="story-row">
          <div class="story-icon" style="background:#D1FAE5">🎵</div>
          <div class="story-info"><div class="story-title">唱一首儿歌</div><div class="story-meta">5分钟 · +15⭐</div></div>
          <div class="story-arrow">→</div>
        </div>
        <div class="story-row">
          <div class="story-icon" style="background:#FCE7F3">🧩</div>
          <div class="story-info"><div class="story-title">拼图游戏</div><div class="story-meta">8分钟 · +20⭐</div></div>
          <div class="story-arrow">→</div>
        </div>
      </div>
    </div>
  </div>

  <div class="ai-bubble">
    <div class="ai-bubble-emoji">🐳</div>
    <div class="ai-bubble-text">来聊天呀！</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active"><div class="nav-emoji">🏠</div><div class="nav-label">家</div></div>
    <div class="nav-item"><div class="nav-emoji">🌱</div><div class="nav-label">成长</div></div>
    <div class="nav-item"><div class="nav-emoji">🤖</div><div class="nav-label">AI</div></div>
    <div class="nav-item"><div class="nav-emoji">📚</div><div class="nav-label">学习</div></div>
    <div class="nav-item"><div class="nav-emoji">🎁</div><div class="nav-label">奖励</div></div>
  </div>
</div>

</body>
</html>
