<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYC³ AI小语 — 呼吸留白·极简克制</title>
<style>
:root {
  --primary: #18181B; --accent: #F97316; --accent-light: #FFF7ED;
  --bg: #FAFAFA; --card: #FFFFFF; --text-main: #09090B; --text-sub: #A1A1AA;
  --border: #F4F4F5; --radius-card: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter','Noto Sans SC','PingFang SC',sans-serif; background:var(--bg); color:var(--text-main); -webkit-font-smoothing:antialiased; }
.phone { width:390px; margin:20px auto; background:var(--card); border-radius:40px; overflow:hidden; box-shadow:0 8px 60px rgba(0,0,0,0.08); min-height:844px; position:relative; }

.header { padding:60px 32px 32px; }
.header-eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-sub); font-weight:600; margin-bottom:8px; }
.header-title { font-size:32px; font-weight:300; letter-spacing:-0.02em; line-height:1.2; }
.header-title strong { font-weight:700; }
.header-sub { font-size:14px; color:var(--text-sub); margin-top:8px; }

/* === Big Number === */
.big-number { padding:0 32px; margin-top:24px; }
.big-num-card { display:flex; align-items:baseline; gap:12px; padding-bottom:24px; border-bottom:1px solid var(--border); }
.big-num { font-size:56px; font-weight:200; letter-spacing:-0.04em; font-family:'Inter',sans-serif; }
.big-num-unit { font-size:16px; color:var(--text-sub); font-weight:500; }
.big-num-label { font-size:13px; color:var(--text-sub); margin-left:auto; }

/* === Minimal Actions === */
.min-actions { padding:32px; }
.min-action-row { display:flex; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); cursor:pointer; transition:padding 0.2s; }
.min-action-row:hover { padding-left:8px; }
.min-action-num { font-size:12px; font-weight:600; color:var(--text-sub); width:24px; font-family:'Inter',sans-serif; }
.min-action-title { font-size:15px; font-weight:500; flex:1; }
.min-action-arrow { color:var(--text-sub); font-size:18px; }

/* === Data Visualization === */
.data-viz { padding:0 32px 32px; }
.viz-label { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-sub); font-weight:600; margin-bottom:16px; }
.viz-bars { display:flex; align-items:flex-end; gap:8px; height:100px; margin-bottom:8px; }
.viz-bar { flex:1; background:var(--border); border-radius:4px 4px 0 0; transition:height 0.3s; }
.viz-bar.active { background:var(--text-main); }
.viz-bar.accent { background:var(--accent); }
.viz-labels { display:flex; gap:8px; }
.viz-label-item { flex:1; text-align:center; font-size:10px; color:var(--text-sub); }

/* === AI Card === */
.ai-card { margin:0 32px 32px; padding:24px; background:var(--accent-light); border-radius:var(--radius-card); }
.ai-card-label { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent); font-weight:700; margin-bottom:8px; }
.ai-card-text { font-size:14px; line-height:1.6; color:var(--text-main); }
.ai-card-meta { font-size:12px; color:var(--text-sub); margin-top:12px; }

/* === Bottom === */
.bottom-nav { position:absolute; bottom:0; left:0; right:0; background:var(--card); display:flex; justify-content:space-around; padding:16px 0 30px; border-top:1px solid var(--border); }
.nav-item { text-align:center; cursor:pointer; opacity:0.4; }
.nav-item.active { opacity:1; }
.nav-dot { width:6px; height:6px; border-radius:50%; background:var(--text-main); margin:0 auto 4px; }
.nav-item.active .nav-dot { background:var(--accent); }
.nav-label { font-size:10px; color:var(--text-sub); font-weight:500; }

/* === Empty State === */
.empty-state { padding:48px 32px; text-align:center; }
.empty-icon { font-size:32px; opacity:0.3; margin-bottom:8px; }
.empty-text { font-size:13px; color:var(--text-sub); }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="header-eyebrow">8月11日 · 周二</div>
    <div class="header-title">小语的<strong>第1026天</strong></div>
    <div class="header-sub">2 岁 9 个月 · 身高 95cm · 体重 14.2kg</div>
  </div>

  <div class="big-number">
    <div class="big-num-card">
      <div class="big-num">95<span style="font-size:28px">cm</span></div>
      <div class="big-num-unit">身高</div>
      <div class="big-num-label">WHO 75分位 ↑</div>
    </div>
    <div class="big-num-card" style="border-bottom:none">
      <div class="big-num">14.2<span style="font-size:28px">kg</span></div>
      <div class="big-num-unit">体重</div>
      <div class="big-num-label">WHO 68分位 →</div>
    </div>
  </div>

  <div class="min-actions">
    <div class="section-title" style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-sub);font-weight:600;margin-bottom:4px">功能导航</div>
    <div class="min-action-row">
      <div class="min-action-num">01</div>
      <div class="min-action-title">成长记录</div>
      <div class="min-action-arrow">→</div>
    </div>
    <div class="min-action-row">
      <div class="min-action-num">02</div>
      <div class="min-action-title">AI 对话</div>
      <div class="min-action-arrow">→</div>
    </div>
    <div class="min-action-row">
      <div class="min-action-num">03</div>
      <div class="min-action-title">今日课程</div>
      <div class="min-action-arrow">→</div>
    </div>
    <div class="min-action-row">
      <div class="min-action-num">04</div>
      <div class="min-action-title">有声绘本</div>
      <div class="min-action-arrow">→</div>
    </div>
  </div>

  <div class="data-viz">
    <div class="viz-label">本周活动量</div>
    <div class="viz-bars">
      <div class="viz-bar" style="height:40%"></div>
      <div class="viz-bar" style="height:65%"></div>
      <div class="viz-bar active" style="height:85%"></div>
      <div class="viz-bar" style="height:55%"></div>
      <div class="viz-bar accent" style="height:95%"></div>
      <div class="viz-bar" style="height:70%"></div>
      <div class="viz-bar" style="height:30%"></div>
    </div>
    <div class="viz-labels">
      <div class="viz-label-item">一</div><div class="viz-label-item">二</div><div class="viz-label-item">三</div>
      <div class="viz-label-item">四</div><div class="viz-label-item">五</div><div class="viz-label-item">六</div><div class="viz-label-item">日</div>
    </div>
  </div>

  <div class="ai-card">
    <div class="ai-card-label">AI 洞察</div>
    <div class="ai-card-text">小语本周的运动量较上周增长了 23%，建议周末安排一次户外活动，有助于大运动能力发展。</div>
    <div class="ai-card-meta">基于近 4 周数据分析 · 刚刚</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active"><div class="nav-dot"></div><div class="nav-label">首页</div></div>
    <div class="nav-item"><div class="nav-dot"></div><div class="nav-label">成长</div></div>
    <div class="nav-item"><div class="nav-dot"></div><div class="nav-label">AI</div></div>
    <div class="nav-item"><div class="nav-dot"></div><div class="nav-label">我的</div></div>
  </div>
</div>

</body>
</html>
