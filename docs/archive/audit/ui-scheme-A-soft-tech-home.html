<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYC³ AI小语 — 柔和科技·温润精致</title>
<style>
:root {
  --primary: #10B981; --primary-light: #D1FAE5; --accent: #06B6D4;
  --warm: #F59E0B; --danger: #EF4444; --bg: #F9FAFB; --card: #FFFFFF;
  --text-main: #1F2937; --text-sub: #6B7280; --border: #E5E7EB;
  --radius-card: 20px; --radius-btn: 12px;
  --shadow-soft: 0 4px 24px rgba(16,185,129,0.08);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans SC','PingFang SC','Helvetica Neue',sans-serif; background:var(--bg); color:var(--text-main); -webkit-font-smoothing:antialiased; }
.phone { width:390px; margin:20px auto; background:var(--card); border-radius:40px; overflow:hidden; box-shadow:0 8px 60px rgba(0,0,0,0.12); min-height:844px; position:relative; }

/* === Header === */
.header { padding:60px 24px 24px; background:linear-gradient(135deg,var(--primary-light) 0%,#E0F7FA 100%); border-radius:0 0 32px 32px; position:relative; overflow:hidden; }
.header::after { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px; border-radius:50%; background:rgba(16,185,129,0.06); }
.greeting { font-size:14px; color:var(--text-sub); margin-bottom:4px; }
.greeting-name { font-size:26px; font-weight:700; color:var(--text-main); }
.greeting-sub { font-size:13px; color:var(--text-sub); margin-top:6px; line-height:1.5; }
.ai-badge { position:absolute; top:60px; right:24px; display:flex; align-items:center; gap:6px; background:var(--card); padding:6px 12px; border-radius:20px; box-shadow:var(--shadow-soft); font-size:12px; font-weight:600; color:var(--primary); }
.ai-dot { width:8px; height:8px; border-radius:50%; background:var(--primary); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* === Stats === */
.stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 24px; margin-top:-12px; position:relative; z-index:1; }
.stat-card { background:var(--card); border-radius:var(--radius-card); padding:16px; box-shadow:var(--shadow-card); text-align:center; transition:transform 0.2s; }
.stat-card:hover { transform:scale(0.98); }
.stat-value { font-size:28px; font-weight:700; font-family:'DM Sans',sans-serif; }
.stat-value.green { color:var(--primary); }
.stat-value.cyan { color:var(--accent); }
.stat-value.amber { color:var(--warm); }
.stat-value.teal { color:#14B8A6; }
.stat-label { font-size:12px; color:var(--text-sub); margin-top:4px; }

/* === Quick Actions === */
.quick-actions { padding:24px; }
.section-title { font-size:16px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:4px; height:18px; background:var(--primary); border-radius:2px; }
.action-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
.action-item { text-align:center; cursor:pointer; transition:transform 0.2s; }
.action-item:hover { transform:translateY(-2px); }
.action-icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:24px; }
.action-icon.growth { background:linear-gradient(135deg,#D1FAE5,#A7F3D0); }
.action-icon.ai { background:linear-gradient(135deg,#E0F7FA,#CFFAFE); }
.action-icon.task { background:linear-gradient(135deg,#FEF3C7,#FDE68A); }
.action-icon.book { background:linear-gradient(135deg,#FCE7F3,#FBCFE8); }
.action-label { font-size:11px; color:var(--text-sub); font-weight:500; }

/* === Today Recommend === */
.recommend { padding:0 24px 24px; }
.recommend-card { background:var(--card); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-card); margin-bottom:12px; display:flex; gap:16px; align-items:center; transition:transform 0.2s; cursor:pointer; }
.recommend-card:hover { transform:scale(0.99); box-shadow:var(--shadow-soft); }
.recommend-img { width:60px; height:60px; border-radius:14px; background:linear-gradient(135deg,var(--primary-light),#E0F7FA); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:28px; }
.recommend-info { flex:1; }
.recommend-title { font-size:14px; font-weight:600; margin-bottom:4px; }
.recommend-desc { font-size:12px; color:var(--text-sub); line-height:1.4; }
.recommend-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; background:var(--primary-light); color:var(--primary); font-weight:600; margin-top:6px; }

/* === AI Float Widget === */
.ai-widget { position:absolute; bottom:100px; right:24px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(16,185,129,0.3); cursor:pointer; animation:float 3s ease-in-out infinite; z-index:10; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.ai-widget span { font-size:24px; }

/* === Bottom Nav === */
.bottom-nav { position:absolute; bottom:0; left:0; right:0; background:var(--card); display:flex; justify-content:space-around; padding:10px 0 30px; box-shadow:0 -2px 20px rgba(0,0,0,0.04); }
.nav-item { text-align:center; cursor:pointer; opacity:0.5; transition:opacity 0.2s; }
.nav-item.active { opacity:1; }
.nav-item.active .nav-icon { color:var(--primary); }
.nav-icon { font-size:22px; margin-bottom:2px; }
.nav-label { font-size:10px; color:var(--text-sub); }

/* === Growth Page Section === */
.growth-section { padding:0 24px 24px; }
.growth-chart { background:var(--card); border-radius:var(--radius-card); padding:20px; box-shadow:var(--shadow-card); margin-bottom:16px; }
.chart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.chart-title { font-size:14px; font-weight:600; }
.chart-tabs { display:flex; gap:4px; }
.chart-tab { font-size:11px; padding:4px 10px; border-radius:8px; color:var(--text-sub); cursor:pointer; }
.chart-tab.active { background:var(--primary-light); color:var(--primary); font-weight:600; }
.chart-area { height:120px; position:relative; overflow:hidden; }
.chart-svg { width:100%; height:100%; }

/* === Milestone Timeline === */
.timeline { position:relative; padding-left:20px; }
.timeline::before { content:''; position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:linear-gradient(to bottom,var(--primary),var(--primary-light)); }
.timeline-item { position:relative; margin-bottom:16px; padding-left:20px; }
.timeline-dot { position:absolute; left:-1px; top:4px; width:16px; height:16px; border-radius:50%; background:var(--card); border:3px solid var(--primary); }
.timeline-dot.warm { border-color:var(--warm); }
.timeline-date { font-size:11px; color:var(--text-sub); margin-bottom:2px; }
.timeline-title { font-size:13px; font-weight:600; }
.timeline-desc { font-size:12px; color:var(--text-sub); margin-top:2px; }

/* === FAB === */
.fab { position:absolute; bottom:100px; left:24px; width:48px; height:48px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.1); cursor:pointer; font-size:20px; color:var(--primary); z-index:10; }

/* === Page Tabs === */
.page-tabs { display:flex; gap:0; padding:0 24px; margin-bottom:16px; border-bottom:1px solid var(--border); }
.page-tab { padding:10px 0; margin-right:24px; font-size:14px; color:var(--text-sub); cursor:pointer; position:relative; font-weight:500; }
.page-tab.active { color:var(--primary); font-weight:600; }
.page-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--primary); border-radius:1px; }

.page-label { padding:20px 24px 0; font-size:22px; font-weight:700; }
</style>
</head>
<body>

<!-- ======== 首页 ======== -->
<div class="phone" style="display:block;">
  <div class="header">
    <div class="greeting">2026年8月11日 · 晴</div>
    <div class="greeting-name">小语，下午好 👋</div>
    <div class="greeting-sub">今天是宝贝出生第 <strong style="color:var(--primary)">1,026</strong> 天 · 2岁9个月</div>

  </div>

  <div class="stats">

    <div class="stat-card"><div class="stat-value cyan">15</div><div class="stat-label">学习天数</div></div>
    <div class="stat-card"><div class="stat-value amber">4</div><div class="stat-label">获得成就</div></div>
    <div class="stat-card"><div class="stat-value teal">8</div><div class="stat-label">完成课程</div></div>

  <div class="quick-actions">
    <div class="section-title">快捷功能</div>
    <div class="action-grid">
      <div class="action-item"><div class="action-icon growth">🌱</div><div class="action-label">成长记录</div></div>

      <div class="action-item"><div class="action-icon book">📚</div><div class="action-label">有声绘本</div></div>
    </div>
  </div>

  <div class="recommend">
    <div class="section-title">今日 AI 推荐</div>
    <div class="recommend-card">
      <div class="recommend-img">📖</div>
      <div class="recommend-info">
        <div class="recommend-title">《好饿的毛毛虫》</div>
        <div class="recommend-desc">AI 根据宝贝 2 岁 9 个月的认知发展阶段推荐</div>
        <span class="recommend-tag">认知发展</span>

    <div class="recommend-card">

        <span class="recommend-tag">数学启蒙</span>
      </div>
    </div>
    <div class="recommend-card">
      <div class="recommend-img">🎨</div>
      <div class="recommend-info">
        <div class="recommend-title">色彩大冒险 · 创意工坊</div>
        <div class="recommend-desc">AI 引导宝贝认识 12 种基础颜色</div>
        <span class="recommend-tag">艺术启蒙</span>
      </div>
    </div>
  </div>

  <div class="ai-widget"><span>🐳</span></div>

  <div class="bottom-nav">
    <div class="nav-item active"><div class="nav-icon">🏠</div><div class="nav-label">首页</div></div>
    <div class="nav-item"><div class="nav-icon">🌱</div><div class="nav-label">成长</div></div>
    <div class="nav-item"><div class="nav-icon">🤖</div><div class="nav-label">AI</div></div>
    <div class="nav-item"><div class="nav-icon">📚</div><div class="nav-label">学习</div></div>
    <div class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">我的</div></div>
  </div>
</div>

</body>
</html>
