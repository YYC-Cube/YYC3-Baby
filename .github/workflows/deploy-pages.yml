name: Deploy Docs to GitHub Pages

"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "public/CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          curl -sL https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-linux-amd64.tar.gz -o pandoc.tar.gz
          tar xzf pandoc.tar.gz
          sudo cp pandoc-3.6.4/bin/pandoc /usr/local/bin/
          pandoc --version | head -1

      - name: Build documentation site
        run: |
          set -e
          mkdir -p site/developer site/status site/standard site/analysis

          # 自定义域名（baby.yyc3.vip）
          cp public/CNAME site/CNAME
          # 禁用 Jekyll：站点已由本工作流预渲染为 HTML
          touch site/.nojekyll

          # 渲染开发者文档 → site/developer/*.html
          for f in docs/developer/*.md; do
            name="$(basename "${f%.md}")"
            title="YYC³ 开发者文档 · ${name}"
            pandoc "$f" -f markdown -s --metadata "title=${title}" --metadata lang=zh-CN \
              --css=style.css --embed-resources=false \
              -o "site/developer/${name}.html"
          done

          # 渲染项目实况 → site/status/*.html
          for f in docs/status/*.md; do
            name="$(basename "${f%.md}")"
            pandoc "$f" -f markdown -s --metadata "title=YYC³ 项目实况 · ${name}" \
              --metadata lang=zh-CN --css=style.css --embed-resources=false \
              -o "site/status/${name}.html"
          done

          # 渲染术语规范 → site/standard/*.html
          for f in docs/standard/*.md; do
            name="$(basename "${f%.md}")"
            pandoc "$f" -f markdown -s --metadata "title=YYC³ 标准规范 · ${name}" \
              --metadata lang=zh-CN --css=style.css --embed-resources=false \
              -o "site/standard/${name}.html"
          done

          # 渲染专项分析 → site/analysis/*.html
          for f in docs/analysis/*.md; do
            name="$(basename "${f%.md}")"
            pandoc "$f" -f markdown -s --metadata "title=YYC³ 专项分析 · ${name}" \
              --metadata lang=zh-CN --css=style.css --embed-resources=false \
              -o "site/analysis/${name}.html"
          done

          # 渲染用户手册 → site/user-manual.html
          pandoc docs/user-manual.md -f markdown -s --metadata "title=YYC³ 用户使用手册" \
            --metadata lang=zh-CN --css=style.css --embed-resources=false \
            -o site/user-manual.html

          # 落地页：文档中心主索引
          pandoc docs/README.md -f markdown -s --metadata "title=YYC³ 文档中心" \
            --metadata lang=zh-CN --css=style.css --embed-resources=false \
            -o site/index.html

          # 项目 README 同步渲染（供「项目 README」交叉链接使用）
          pandoc README.md -f markdown -s --metadata "title=YYC³ 小语智能成长守护系统" \
            --metadata lang=zh-CN --css=style.css --embed-resources=false \
            -o site/README.html

          # README 顶图随站点发布（README.html 内相对引用 public/YYC3-Family.png）
          mkdir -p site/public
          cp public/YYC3-Family.png site/public/YYC3-Family.png

          # 站内 .md 链接改写为 .html（跨页面导航可用）
          find site -name "*.html" -exec sed -i \
            -e 's/href="\([^"]*\)\.md"/href="\1.html"/g' \
            -e 's/src="\([^"]*\)\.md"/src="\1.html"/g' {} +

          # 落地页中 ../README.md 实际指向站点根的 README.html
          sed -i 's|href="../README.html"|href="README.html"|g' site/index.html

          # 站点样式
          cat > site/style.css <<'CSS'
          body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
                 max-width: 920px; margin: 0 auto; padding: 32px 24px; line-height: 1.75; color: #1f2328; }
          h1, h2, h3 { line-height: 1.3; margin-top: 1.6em; }
          h1 { border-bottom: 2px solid #d0d7de; padding-bottom: .3em; }
          h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
          code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
          pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow-x: auto; }
          pre code { background: none; padding: 0; }
          table { border-collapse: collapse; width: 100%; margin: 1em 0; }
          th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
          th { background: #f6f8fa; }
          a { color: #0969da; text-decoration: none; }
          a:hover { text-decoration: underline; }
          img { max-width: 100%; }
          blockquote { border-left: 4px solid #d0d7de; margin: 0; padding-left: 16px; color: #57606a; }
          CSS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
