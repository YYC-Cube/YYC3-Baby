name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (node:sqlite 需要 ≥ 22.5)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Test (node:sqlite 直测)
        run: bun run test:node

      - name: Build
        run: bun run build

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: e2e (生产构建 + 账号自举，无需种子数据)
        env:
          # next start 为 production 模式：必须显式提供 JWT_SECRET；种子演示账号被生产守卫跳过，
          # e2e 第 0 步经 register 自举账号
          JWT_SECRET: ci-test-secret-not-for-production
        run: bun run test:e2e
